<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специалист — Реацентр Развитие</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--accent:#1D4CAA;--accent-dark:#0F2F70;--accent-pale:#EEF3FF;--gray:#64748B;--r:16px;--shadow:0 4px 20px rgba(15,47,112,.08);--shadow-sm:0 2px 10px rgba(15,47,112,.06)}
        html,body{-webkit-user-select:none;user-select:none}
        body{font-family:'Inter',sans-serif;color:#1E293B;line-height:1.7;background:#F8FAFC;padding-top:72px;min-height:100vh}
        a{color:var(--accent);text-decoration:none}
        /* ─── HEADER ─── */
        .site-hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(29,76,170,.08);height:72px;display:flex;align-items:center;padding:0 32px;gap:16px}
        .site-hdr img{height:32px}
        .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gray);transition:color .2s}
        .back:hover{color:var(--accent)}
        .back svg{opacity:.6}
        .site-hdr-divider{width:1px;height:20px;background:rgba(0,0,0,.1);margin:0 8px}
        /* ─── CONTENT ─── */
        .wrap{max-width:740px;margin:0 auto;padding:40px 24px 80px}
        /* ─── HERO CARD ─── */
        .spec-hero{display:flex;gap:28px;align-items:flex-start;background:#fff;border-radius:var(--r);padding:32px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid rgba(29,76,170,.07)}
        .spec-hero img{width:180px;height:220px;border-radius:16px;object-fit:cover;object-position:center 25%;flex-shrink:0;box-shadow:0 6px 20px rgba(15,47,112,.14)}
        .spec-hero h1{font-family:'Geologica',sans-serif;font-size:22px;font-weight:800;color:var(--accent-dark);margin-bottom:4px;line-height:1.25}
        .spec-role{color:var(--accent);font-weight:600;font-size:14px;display:block;margin-bottom:12px}
        /* ─── SECTION CARDS ─── */
        .card{background:#fff;border-radius:var(--r);padding:24px;margin-bottom:16px;box-shadow:var(--shadow-sm);border:1px solid rgba(29,76,170,.07)}
        .card-title{font-family:'Geologica',sans-serif;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--accent-pale)}
        .edu-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #F8FAFC;font-size:14px;line-height:1.5}
        .edu-row:last-child{border:none;padding-bottom:0}
        .edu-label{color:var(--gray);min-width:120px;flex-shrink:0;font-weight:500;font-size:13px}
        /* ─── DOC BUTTONS → PREVIEW GRID ─── */
        .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
        .doc-thumb{position:relative;background:var(--accent-pale);border:1.5px solid rgba(29,76,170,.12);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
        .doc-thumb:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(29,76,170,.14);transform:translateY(-2px)}
        .doc-thumb canvas{width:100%;height:100%;object-fit:cover;border-radius:12px}
        .doc-thumb-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--accent);opacity:.6}
        .doc-thumb-placeholder svg{width:32px;height:32px}
        .doc-thumb-label{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(0deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.7) 100%);font-size:11px;font-weight:600;color:var(--accent-dark);line-height:1.3;text-align:center;backdrop-filter:blur(4px)}
        .doc-thumb-wm{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url('img/logo.svg');background-size:60px;background-repeat:repeat;background-position:center;transform:rotate(-25deg);z-index:2}
        .no-docs{color:var(--gray);font-size:14px;padding:8px 0}
        .notice{margin-top:8px;padding:14px 18px;background:#FFFBEB;border-radius:12px;font-size:12px;color:#92400E;line-height:1.55;border:1px solid #FDE68A}
        .err{text-align:center;padding:60px 20px;color:var(--gray)}
        /* ─── PDF MODAL ─── */
        .pdf-modal{position:fixed;inset:0;z-index:9999;background:rgba(10,30,70,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
        .pdf-modal.open{display:flex}
        .pdf-box{background:#fff;border-radius:20px;width:min(920px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 32px 72px rgba(0,0,0,.3)}
        .pdf-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #E2E8F0;flex-shrink:0}
        .pdf-toolbar h3{font-family:'Geologica',sans-serif;font-size:15px;font-weight:700;flex:1;padding-right:12px;color:var(--accent-dark)}
        .pdf-toolbar button{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.02em}
        .pdf-toolbar button:hover{background:var(--accent-dark)}
        .pdf-scroll{overflow:auto;padding:20px;flex:1;-webkit-overflow-scrolling:touch;background:#F8FAFC}
        .pdf-scroll canvas{display:block;margin:0 auto 16px;max-width:100%;height:auto!important;box-shadow:0 2px 12px rgba(0,0,0,.1);border-radius:4px}
        .pdf-loading{padding:60px;text-align:center;color:var(--gray)}
        @media print{body{display:none!important}}
        @media(max-width:560px){
            .site-hdr{padding:0 16px}
            .wrap{padding:24px 16px 60px}
            .spec-hero{flex-direction:column;align-items:center;text-align:center;gap:16px}
            .spec-hero img{width:140px;height:170px}
            .edu-row{flex-direction:column;gap:3px}
            .edu-label{min-width:0}
            .doc-grid{grid-template-columns:repeat(2,1fr);gap:10px}
        }
    </style>
</head>
<body>
<header class="site-hdr">
  <a href="index.html"><img src="img/logo.svg" alt="Реацентр Развитие"></a>
  <div class="site-hdr-divider"></div>
  <a href="index.html#team" class="back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Все специалисты
  </a>
</header>
<div class="wrap" id="page">
    <div id="content"></div>
</div>
<div class="pdf-modal" id="pdfModal" role="dialog" aria-modal="true" aria-label="Просмотр документа">
    <div class="pdf-box" onclick="event.stopPropagation()">
        <div class="pdf-toolbar">
            <h3 id="pdfTitle">Документ</h3>
            <button type="button" id="pdfClose">Закрыть</button>
        </div>
        <div class="pdf-scroll" id="pdfScroll">
            <div class="pdf-loading" id="pdfLoading">Загрузка документа…</div>
        </div>
    </div>
</div>

<script src="js/specialists-data.js"></script>
<script src="js/pdf.min.js"></script>
<script>
(function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var slug = params.get('id');
    var content = document.getElementById('content');
    var spec = slug && window.SPECIALISTS[slug];

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) e.preventDefault();
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 's' || e.key === 'S')) e.preventDefault();
        if (e.key === 'PrintScreen') e.preventDefault();
    });
    document.addEventListener('dragstart', function (e) { e.preventDefault(); });

    if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
    }

    if (!spec) {
        content.innerHTML = '<div class="err"><p>Специалист не найден.</p><p style="margin-top:12px"><a href="index.html#team">Вернуться к списку</a></p></div>';
        document.title = 'Специалист не найден — Реацентр Развитие';
        return;
    }

    document.title = spec.name + ' — Реацентр Развитие';

    var eduHtml = spec.education.map(function (row) {
        return '<div class="edu-row"><span class="edu-label">' + row[0] + '</span><span>' + row[1] + '</span></div>';
    }).join('');

    var docsHtml = '';
    if (spec.docs.length) {
        var placeholderSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>';
        docsHtml = '<div class="card"><p class="card-title">Документы об образовании</p><div class="doc-grid">' +
            spec.docs.map(function (d) {
                return '<div class="doc-thumb" data-slug="' + slug + '" data-doc="' + d.id + '">' +
                    '<div class="doc-thumb-placeholder">' + placeholderSvg + '</div>' +
                    '<div class="doc-thumb-wm"></div>' +
                    '<div class="doc-thumb-label">' + d.title + '</div></div>';
            }).join('') + '</div></div>';
    } else {
        docsHtml = '<div class="card"><p class="card-title">Документы об образовании</p><p class="no-docs">Сканы документов пока не размещены. Сведения об образовании — в <a href="legal.html#specialists">правовой информации</a>.</p></div>';
    }

    content.innerHTML =
        '<div class="spec-hero">' +
            '<img src="' + spec.photo + '" alt="' + spec.name + '" draggable="false">' +
            '<div><h1>' + spec.name + '</h1><span class="spec-role">' + spec.role + '</span></div>' +
        '</div>' +
        '<div class="card"><p class="card-title">Образование</p>' + eduHtml + '</div>' +
        docsHtml +
        '<div class="notice">Документы предназначены только для просмотра. Копирование, скачивание и печать ограничены.</div>';

    var modal = document.getElementById('pdfModal');
    var pdfScroll = document.getElementById('pdfScroll');
    var pdfLoading = document.getElementById('pdfLoading');
    var pdfTitle = document.getElementById('pdfTitle');

    function closeModal() {
        modal.classList.remove('open');
        pdfScroll.querySelectorAll('canvas').forEach(function (c) { c.remove(); });
        pdfLoading.style.display = 'none';
        document.body.style.overflow = '';
    }

    document.getElementById('pdfClose').addEventListener('click', closeModal);
    modal.addEventListener('click', closeModal);

    content.addEventListener('click', function (e) {
        var btn = e.target.closest('.doc-thumb');
        if (!btn) return;
        var s = btn.getAttribute('data-slug');
        var docId = btn.getAttribute('data-doc');
        var url = window.getSpecialistDocUrl(s, docId);
        var docMeta = spec.docs.find(function (d) { return d.id === docId; });
        if (!url || !docMeta) return;
        openPdf(url, docMeta.title);
    });

    // Generate thumbnails for doc cards
    function generateThumbnails() {
        if (!window.pdfjsLib || location.protocol === 'file:') return;
        var thumbs = document.querySelectorAll('.doc-thumb');
        thumbs.forEach(function (thumb) {
            var s = thumb.getAttribute('data-slug');
            var docId = thumb.getAttribute('data-doc');
            var url = window.getSpecialistDocUrl(s, docId);
            if (!url) return;
            fetch(url).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.arrayBuffer();
            }).then(function (data) {
                return pdfjsLib.getDocument({ data: data }).promise;
            }).then(function (pdf) {
                return pdf.getPage(1);
            }).then(function (page) {
                var vp = page.getViewport({ scale: 0.4 });
                var canvas = document.createElement('canvas');
                canvas.width = vp.width;
                canvas.height = vp.height;
                var ctx = canvas.getContext('2d');
                page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
                    var placeholder = thumb.querySelector('.doc-thumb-placeholder');
                    if (placeholder) placeholder.remove();
                    thumb.insertBefore(canvas, thumb.firstChild);
                });
            }).catch(function () { /* keep placeholder */ });
        });
    }
    generateThumbnails();

    function openPdf(url, title) {
        if (!window.pdfjsLib) {
            alert('Просмотрщик PDF недоступен. Обновите страницу.');
            return;
        }
        if (location.protocol === 'file:') {
            alert('Для просмотра документов откройте сайт через веб-сервер (например, Live Preview), а не как файл с диска.');
            return;
        }
        pdfTitle.textContent = title;
        pdfScroll.querySelectorAll('canvas').forEach(function (c) { c.remove(); });
        pdfLoading.textContent = 'Загрузка документа…';
        pdfLoading.style.display = 'block';
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';

        fetch(url)
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.arrayBuffer();
            })
            .then(function (data) {
                return pdfjsLib.getDocument({ data: data }).promise;
            })
            .then(function (pdf) {
                pdfLoading.style.display = 'none';
                var chain = Promise.resolve();
                for (var p = 1; p <= pdf.numPages; p++) {
                    (function (pageNum) {
                        chain = chain.then(function () {
                            return pdf.getPage(pageNum).then(function (page) {
                                var scale = Math.min(1.5, (pdfScroll.clientWidth - 32) / page.getViewport({ scale: 1 }).width);
                                var viewport = page.getViewport({ scale: scale });
                                var canvas = document.createElement('canvas');
                                canvas.width = viewport.width;
                                canvas.height = viewport.height;
                                pdfScroll.appendChild(canvas);
                                return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function () {
                                    // Watermark overlay
                                    var ctx = canvas.getContext('2d');
                                    ctx.save();
                                    ctx.globalAlpha = 0.08;
                                    ctx.translate(canvas.width / 2, canvas.height / 2);
                                    ctx.rotate(-25 * Math.PI / 180);
                                    ctx.font = 'bold 28px Geologica, Inter, sans-serif';
                                    ctx.fillStyle = '#1D4CAA';
                                    ctx.textAlign = 'center';
                                    var wmText = 'РЕАЦЕНТР РАЗВИТИЕ';
                                    var stepX = 220, stepY = 120;
                                    for (var wy = -canvas.height; wy < canvas.height; wy += stepY) {
                                        for (var wx = -canvas.width; wx < canvas.width; wx += stepX) {
                                            ctx.fillText(wmText, wx, wy);
                                        }
                                    }
                                    ctx.restore();
                                });
                            });
                        });
                    })(p);
                }
                return chain;
            })
            .catch(function () {
                pdfLoading.style.display = 'block';
                pdfLoading.textContent = 'Не удалось загрузить документ. Проверьте подключение к интернету и обновите страницу.';
            });
    }
})();
</script>
</body>
</html>
